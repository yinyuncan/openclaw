name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT="$HOME/.android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/bin" "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/lib" "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install 
            "platform-tools" 
            "platforms;android-36" 
            "build-tools;36.0.0"

      - name: Build Debug APKs
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon :app:assemblePlayDebug :app:assembleThirdPartyDebug
          ls -la app/build/outputs/apk/*/debug/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-debug-apks
          path: apps/android/app/build/outputs/apk/**/*.apk
          retention-days: 1
